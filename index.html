<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios en Vivo - Streaming Player</title>
    <!-- Importar Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Cuadrícula adaptable de estaciones */
        .grid-stations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .station-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .station-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .logo-container {
            width: 90px;
            height: 90px;
            background: #0f172a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border: 2px solid var(--card-border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .station-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .station-info {
            text-align: center;
            width: 100%;
        }

        .station-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .status {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .station-card.playing .status {
            color: #34d399;
            font-weight: 600;
        }

        audio {
            width: 100%;
            height: 36px;
            border-radius: 8px;
            outline: none;
        }

        /* Personalización sutil para navegadores basados en WebKit */
        audio::-webkit-media-controls-panel {
            background-color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Emisoras en Vivo</h1>
            <p class="subtitle">Selecciona tu estación favorita. Solo se reproducirá una transmisión a la vez.</p>
        </header>

        <div class="grid-stations" id="stationsGrid"></div>
    </div>

    <script>
        // Lista ordenada alfabéticamente vinculada con su respectivo logo en la raíz
        const stations = [
            { name: "Alfa", url: "https://ddycmnicl95kp.cloudfront.net/live/r0nwiyol2l12/master.m3u8", logo: "alfa.png" },
            { name: "Éxitos 90.9", url: "https://ddycmnicl95kp.cloudfront.net/live/yff15vi5xsxi/master.m3u8", logo: "exitos.png" },
            { name: "Éxitos 107.1", url: "https://ddycmnicl95kp.cloudfront.net/live/vk54lkazkyxg/master.m3u8", logo: "exitosx.png" },
            { name: "Extrema", url: "https://ddycmnicl95kp.cloudfront.net/live/8bp8yay2zaog/master.m3u8", logo: "xtrema.png" },
            { name: "Fiesta FM", url: "https://ddycmnicl95kp.cloudfront.net/live/h8fdwk021ch2/master.m3u8", logo: "fiesta.png" },
            { name: "Flix 93.9", url: "https://ddycmnicl95kp.cloudfront.net/live/bc0guefb9qsv/master.m3u8", logo: "flix.png" },
            { name: "Galaxia", url: "https://ddycmnicl95kp.cloudfront.net/live/3r10218cqvb6/master.m3u8", logo: "galaxia.png" },
            { name: "Joya", url: "https://ddycmnicl95kp.cloudfront.net/live/5zgdqpigoa9d/master.m3u8", logo: "joya.png" },
            { name: "La Marca", url: "https://ddycmnicl95kp.cloudfront.net/live/x9til9l95v7l/master.m3u8", logo: "lamarca.png" },
            { name: "Ranchera", url: "https://ddycmnicl95kp.cloudfront.net/live/051kh1xde9ws/master.m3u8", logo: "ranchera.png" },
            { name: "Sonora", url: "https://ddycmnicl95kp.cloudfront.net/live/6on6zmhisqhm/master.m3u8", logo: "sonora.png" },
            { name: "Tropicálida", url: "https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8", logo: "tropicalida.png" }
        ];

        const gridContainer = document.getElementById('stationsGrid');
        const audioElements = [];
        const cardElements = [];

        stations.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = 'station-card';

            card.innerHTML = `
                <div class="logo-container">
                    <img src="${station.logo}" alt="${station.name}" class="station-logo" onerror="this.src='https://via.placeholder.placeholder/90?text=Radio'">
                </div>
                <div class="station-info">
                    <div class="station-name">${station.name}</div>
                    <div class="status" id="status-${index}">Listo</div>
                </div>
                <audio id="audio-${index}" controls></audio>
            `;

            gridContainer.appendChild(card);

            const audioElement = document.getElementById(`audio-${index}`);
            const statusSpan = document.getElementById(`status-${index}`);
            audioElements.push(audioElement);
            cardElements.push(card);

            // Control de reproducción única y efectos visuales de tarjeta activa
            audioElement.addEventListener('play', () => {
                audioElements.forEach((el, i) => {
                    if (i !== index) {
                        el.pause();
                        cardElements[i].classList.remove('playing');
                    }
                });
                card.classList.add('playing');
                statusSpan.textContent = "Reproduciendo";
            });

            audioElement.addEventListener('pause', () => {
                card.classList.remove('playing');
                statusSpan.textContent = "Pausado";
            });

            // Configuración HLS por reproductor
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(station.url);
                hls.attachMedia(audioElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    statusSpan.textContent = "Conectado";
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        statusSpan.textContent = "Error de señal";
                    }
                });
            } else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
                audioElement.src = station.url;
                statusSpan.textContent = "Conectado (Nativo)";
            }
        });
    </script>
</body>
</html>
