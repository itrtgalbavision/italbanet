<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radios On Line GUATE</title>

    <!-- Configuración PWA / GitHub Pages -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b0f19">

    <!-- Configuración para iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radios GUATE">

    <!-- Iconos -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" href="./icon.png?v=2">

    <!-- Importar Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --online-color: #10b981;
            --offline-color: #f43f5e;
            --checking-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px 120px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .container { width: 100%; max-width: 1100px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 {
            font-size: 1.8rem; margin: 0 0 6px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin: 0; }

        .controls-container {
            margin-bottom: 25px; display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 10px; width: 100%; max-width: 680px; margin-left: auto; margin-right: auto;
        }
        .search-input {
            flex: 1; min-width: 200px; background-color: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 25px; padding: 12px 18px; color: var(--text-main);
            font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent-color); }

        .action-btn {
            background-color: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main);
            border-radius: 25px; padding: 11px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease;
            white-space: nowrap; -webkit-tap-highlight-color: transparent;
        }
        .action-btn:active { transform: scale(0.96); background-color: #17233d; }
        .action-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .action-btn.monitoring {
            border-color: rgba(16, 185, 129, 0.5);
            color: #34d399;
            background-color: rgba(16, 185, 129, 0.08);
        }

        .grid-stations {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
        }
        .station-card {
            background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;
            padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
            transition: all 0.2s ease; position: relative; overflow: hidden;
        }
        .station-card::before {
            content: ""; position: absolute; bottom: -10px; right: -10px; width: 110px; height: 110px;
            background-image: var(--card-bg-logo); background-size: contain; background-repeat: no-repeat;
            background-position: bottom right; opacity: 0.05; pointer-events: none; transition: opacity 0.3s ease;
        }
        .station-card.playing::before { opacity: 0.12; }
        .station-card.playing {
            border-color: var(--accent-color); box-shadow: 0 0 20px var(--accent-glow); background-color: #17233d;
        }
        .station-card.connecting { border-color: #f59e0b; box-shadow: 0 0 14px rgba(245,158,11,.25); }

        /* Botón pequeño de estado en esquina superior derecha */
        .monitor-pill {
            position: relative;
            z-index: 3;
            align-self: flex-end;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            background: rgba(9, 13, 22, 0.85);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .monitor-pill:hover { border-color: rgba(148, 163, 184, 0.45); }
        .monitor-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background-color: var(--text-muted);
            flex-shrink: 0;
        }
        .monitor-pill.online {
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.1);
        }
        .monitor-pill.online .monitor-dot {
            background-color: var(--online-color);
            box-shadow: 0 0 8px var(--online-color);
        }
        .monitor-pill.offline {
            color: #fb7185;
            border-color: rgba(244, 63, 94, 0.45);
            background: rgba(244, 63, 94, 0.12);
        }
        .monitor-pill.offline .monitor-dot {
            background-color: var(--offline-color);
            box-shadow: 0 0 8px var(--offline-color);
        }
        .monitor-pill.checking {
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.45);
            background: rgba(245, 158, 11, 0.1);
        }
        .monitor-pill.checking .monitor-dot {
            background-color: var(--checking-color);
            animation: pulseDot 0.9s infinite alternate;
        }
        @keyframes pulseDot {
            from { opacity: 0.35; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1.15); }
        }

        .logo-container {
            width: 100px; height: 72px; background: #090d16; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; padding: 6px;
            border: 1px solid var(--card-border); position: relative; z-index: 2; cursor: pointer;
        }
        .station-logo { max-width: 100%; max-height: 100%; object-fit: contain; }
        .station-info { text-align: center; width: 100%; position: relative; z-index: 2; }
        .station-name {
            font-weight: 700; font-size: 1rem; margin-bottom: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .status { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .station-card.playing .status { color: #34d399; }
        .station-card.connecting .status { color: #fbbf24; }

        .last-change {
            font-size: 0.68rem; color: var(--text-muted); margin-top: 3px;
            min-height: 14px; opacity: 0.85;
        }

        .custom-player {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(11, 15, 25, 0.98));
            border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 20px; padding: 6px 12px;
            box-sizing: border-box; gap: 10px; position: relative; z-index: 2;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 4px 12px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px); transition: all 0.3s ease;
        }
        .station-card.playing .custom-player {
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 15px rgba(56, 189, 248, 0.25);
        }
        .play-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); border: none;
            width: 42px; height: 42px; border-radius: 50%; color: #090d16;
            display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0;
            position: relative; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); -webkit-tap-highlight-color: transparent;
        }
        .play-btn::after {
            content: ''; position: absolute; inset: -3px; border-radius: 50%;
            border: 1px solid rgba(56, 189, 248, 0.5); opacity: 0.6; transition: all 0.3s ease;
        }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(56, 189, 248, 0.8); }
        .play-btn:active { transform: scale(0.95); }
        .station-card.playing .play-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); color: #022c22;
        }
        .station-card.playing .play-btn::after { border-color: rgba(16, 185, 129, 0.8); animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .play-btn svg { width: 20px; height: 20px; fill: currentColor; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }

        .cyber-equalizer {
            display: flex; align-items: flex-end; gap: 3px; height: 18px; padding: 0 4px;
            flex-grow: 1; justify-content: center; opacity: 0.3; transition: opacity 0.3s ease;
        }
        .station-card.playing .cyber-equalizer { opacity: 1; }
        .eq-bar { width: 3px; background: var(--accent-color); border-radius: 2px; transform-origin: bottom; height: 20%; }
        .station-card.playing .eq-bar:nth-child(1) { animation: eqAnim 0.8s ease-in-out infinite alternate; }
        .station-card.playing .eq-bar:nth-child(2) { animation: eqAnim 1.1s ease-in-out infinite alternate 0.2s; }
        .station-card.playing .eq-bar:nth-child(3) { animation: eqAnim 0.7s ease-in-out infinite alternate 0.4s; }
        .station-card.playing .eq-bar:nth-child(4) { animation: eqAnim 0.9s ease-in-out infinite alternate 0.1s; }
        @keyframes eqAnim {
            0% { height: 15%; background-color: #38bdf8; }
            50% { height: 95%; background-color: #818cf8; }
            100% { height: 35%; background-color: #34d399; }
        }

        .vol-btn-group {
            display: flex; align-items: center; gap: 4px; background: rgba(30, 41, 59, 0.7);
            padding: 4px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .vol-mute-btn {
            background: transparent; border: none; color: var(--text-muted); display: flex;
            align-items: center; padding: 6px; cursor: pointer; border-radius: 50%;
            transition: all 0.2s ease; -webkit-tap-highlight-color: transparent;
        }
        .vol-mute-btn:hover { color: var(--accent-color); background: rgba(56, 189, 248, 0.1); }
        .vol-mute-btn.muted { color: #f43f5e; background: rgba(244, 63, 94, 0.15); }
        .vol-mute-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .floating-player {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(11, 15, 25, 0.88); backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-top: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 12px 20px; box-sizing: border-box; display: none;
            justify-content: space-between; align-items: center; z-index: 1000; transition: all 0.3s ease;
        }
        .floating-player.active { display: flex; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .floating-info { display: flex; align-items: center; gap: 14px; }
        .floating-logo {
            width: 44px; height: 44px; object-fit: contain; background: #090d16; border-radius: 10px;
            padding: 4px; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .floating-text .title { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.3px; }
        .floating-text .desc {
            font-size: 0.75rem; color: #34d399; display: flex; align-items: center; gap: 6px;
            font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .floating-text .desc::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            background-color: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #pwa-install-banner {
            display: none; position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 420px; background: var(--card-bg); color: var(--text-main);
            padding: 16px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 2000; border: 1px solid var(--accent-color);
        }
        @media (max-width: 480px) {
            .controls-container { flex-direction: column; }
            .search-input, .action-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Radios Streaming - GUATEMALA</h1>
            <p class="subtitle">Selecciona tu estación favorita para iniciar la transmisión o revisa su estado en vivo.</p>
        </header>

        <div class="controls-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora...">
            <button id="monitorToggleBtn" class="action-btn" title="Activar o pausar monitoreo automático">
                <span id="monitorBtnDot" class="monitor-dot"></span>
                <span id="monitorBtnLabel">Monitor: OFF</span>
            </button>
            <button id="refreshBtn" class="action-btn" title="Probar todas ahora">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                Chequear
            </button>
        </div>

        <div class="grid-stations" id="stationsGrid"></div>
    </div>

    <!-- Banner / Popup de aviso de instalación -->
    <div id="pwa-install-banner">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <strong style="font-size: 16px; color: var(--accent-color);">📲 Instalar App Radios</strong>
            <button onclick="cerrarBanner()" style="background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted);">✕</button>
        </div>
        <p id="pwa-banner-text" style="font-size: 0.88rem; line-height: 1.4; margin: 0 0 14px 0; color: var(--text-muted);">
            Instala esta aplicación en tu pantalla de inicio para acceder rápidamente.
        </p>
        <button id="pwa-install-btn" style="display: none; width: 100%; background: var(--accent-color); color: #0b0f19; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer;">
            Instalar en la pantalla de inicio
        </button>
    </div>

    <div class="floating-player" id="floatingPlayer">
        <div class="floating-info">
            <img id="floatingLogo" src="" alt="" class="floating-logo">
            <div class="floating-text">
                <div class="title" id="floatingTitle">Sin selección</div>
                <div class="desc" id="floatingStatus">En vivo</div>
            </div>
        </div>
        <button class="play-btn" id="floatingPlayBtn" title="Play/Pause">
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>

    <audio id="mainPlayer" preload="none" playsinline crossorigin="anonymous"></audio>

    <script>
        const stations = [
            { name: "Xtrema 101.3", url: "https://ddycmnicl95kp.cloudfront.net/live/8bp8yay2zaog/master.m3u8", logo: "xtrema.png" },
            { name: "La Marca 94.1", url: "https://ddycmnicl95kp.cloudfront.net/live/x9til9l95v7l/master.m3u8", logo: "lamarca.png" },
            { name: "Galaxia 88.5", url: "https://ddycmnicl95kp.cloudfront.net/live/3r10218cqvb6/master.m3u8", logo: "galaxia.png" },
            { name: "Tropicalida 104.9", url: "https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8", logo: "tropicalida.png" },
            { name: "Alfa 97.3", url: "https://ddycmnicl95kp.cloudfront.net/live/r0nwiyol2l12/master.m3u8", logo: "alfa.png" },
            { name: "Exitos 90.9", url: "https://ddycmnicl95kp.cloudfront.net/live/yff15vi5xsxi/master.m3u8", logo: "exitos.png" },
            { name: "Fiesta 98.5", url: "https://ddycmnicl95kp.cloudfront.net/live/h8fdwk021ch2/master.m3u8", logo: "fiesta.png" },
            { name: "Joya 92.9", url: "https://ddycmnicl95kp.cloudfront.net/live/5zgdqpigoa9d/master.m3u8", logo: "joya.png" },
            { name: "Ranchera 95.7", url: "https://ddycmnicl95kp.cloudfront.net/live/051kh1xde9ws/master.m3u8", logo: "ranchera.png" },
            { name: "Sonora 96.9", url: "https://ddycmnicl95kp.cloudfront.net/live/6on6zmhisqhm/master.m3u8", logo: "sonora.png" },
            { name: "Exitos XELA 107.1", url: "https://ddycmnicl95kp.cloudfront.net/live/vk54lkazkyxg/master.m3u8", logo: "exitosx.png" },
            { name: "Flix Xela 93.9", url: "https://ddycmnicl95kp.cloudfront.net/live/bc0guefb9qsv/master.m3u8", logo: "flix.png" }
        ];

        // ============ ESTADO GLOBAL REPRODUCTOR ============
        const audio = document.getElementById('mainPlayer');
        let hls = null;
        let currentIndex = -1;
        let playToken = 0;
        let isConnecting = false;
        let retryCount = 0;
        const MAX_RETRIES = 3;
        let retryTimer = null;
        let connectTimeout = null;
        let stallTimer = null;
        let lastTime = -1;
        let stallCount = 0;
        let isMuted = false;

        // ============ ESTADO MONITOREO ONLINE / OFFLINE ============
        const MONITOR_INTERVAL_MS = 30000; // Cada 30 segundos
        const CHECK_TIMEOUT_MS = 5000;     // 5 segundos por emisora
        let monitorTimer = null;
        let isMonitoring = false;

        // Guarda el último estado conocido y la hora exacta del cambio
        const monitorState = stations.map(() => ({
            state: 'unknown', // 'unknown' | 'checking' | 'online' | 'offline'
            lastChangeTime: null
        }));

        const gridContainer = document.getElementById('stationsGrid');
        const activeCards = [];
        const playBtns = [];
        const statusSpans = [];
        const muteBtns = [];
        const monitorPills = [];
        const monitorPillLabels = [];
        const lastChangeSpans = [];

        const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        const pauseIcon = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        const iconVolHigh = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        const iconMute = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        const floatingPlayer = document.getElementById('floatingPlayer');
        const floatingPlayBtn = document.getElementById('floatingPlayBtn');
        const floatingTitle = document.getElementById('floatingTitle');
        const floatingStatus = document.getElementById('floatingStatus');
        const floatingLogo = document.getElementById('floatingLogo');

        const hlsSupported = () => window.Hls && Hls.isSupported();
        const nativeHlsSupported = () => audio.canPlayType('application/vnd.apple.mpegurl');

        function formatNowTime() {
            return new Date().toLocaleTimeString('es-GT', {
                hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }

        // ============ PWA ============
        let deferredPrompt;
        const banner = document.getElementById('pwa-install-banner');
        const bannerText = document.getElementById('pwa-banner-text');
        const installBtn = document.getElementById('pwa-install-btn');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

        if (!isStandalone) {
            if (isIOS) {
                bannerText.innerHTML = 'Para guardar como App en tu iPhone:<br>1. Toca el botón <strong>Compartir</strong> (<span style="font-size:16px;">⎘</span>)<br>2. Elige <strong>"Añadir a pantalla de inicio"</strong>.';
                banner.style.display = 'block';
            } else {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    bannerText.textContent = 'Añade Radios Streaming a tu pantalla de inicio para un acceso rápido.';
                    installBtn.style.display = 'block';
                    banner.style.display = 'block';
                });
            }
        }
        installBtn.addEventListener('click', () => {
            banner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            }
        });
        function cerrarBanner() { banner.style.display = 'none'; }

        // ============ CONSTRUIR TARJETAS ============
        stations.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = 'station-card';
            card.style.setProperty('--card-bg-logo', `url('${station.logo}')`);
            card.innerHTML = `
                <button class="monitor-pill" title="Clic para probar esta emisora ahora">
                    <span class="monitor-dot"></span>
                    <span class="pill-label">Sin probar</span>
                </button>
                <div class="logo-container">
                    <img src="${station.logo}" alt="${station.name}" class="station-logo" loading="lazy" onerror="this.src='https://via.placeholder.com/100x60?text=RADIO'">
                </div>
                <div class="station-info">
                    <div class="station-name">${station.name}</div>
                    <div class="status">Listo</div>
                    <div class="last-change"></div>
                </div>
                <div class="custom-player">
                    <button class="play-btn" title="Reproducir">${playIcon}</button>
                    <div class="cyber-equalizer"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>
                    <div class="vol-btn-group">
                        <button class="vol-mute-btn" title="Silenciar">${iconVolHigh}</button>
                    </div>
                </div>`;
            gridContainer.appendChild(card);

            const pill = card.querySelector('.monitor-pill');
            const pillLabel = card.querySelector('.pill-label');
            const playBtn = card.querySelector('.play-btn');
            const status = card.querySelector('.status');
            const lastChange = card.querySelector('.last-change');
            const muteBtn = card.querySelector('.vol-mute-btn');

            activeCards.push(card);
            monitorPills.push(pill);
            monitorPillLabels.push(pillLabel);
            playBtns.push(playBtn);
            statusSpans.push(status);
            lastChangeSpans.push(lastChange);
            muteBtns.push(muteBtn);

            pill.addEventListener('click', (e) => {
                e.stopPropagation();
                checkStationHealth(index);
            });
            playBtn.addEventListener('click', () => handlePlayTrigger(index));
            muteBtn.addEventListener('click', toggleMute);
            card.querySelector('.logo-container').addEventListener('click', () => handlePlayTrigger(index));
        });

        // ============ LÓGICA DE MONITOREO ONLINE / OFFLINE ============
        function updateMonitorPillUI(index, visualState) {
            const pill = monitorPills[index];
            const label = monitorPillLabels[index];
            const info = monitorState[index];

            pill.classList.remove('online', 'offline', 'checking');

            if (visualState === 'checking') {
                pill.classList.add('checking');
                label.textContent = 'Probando...';
                return;
            }

            if (info.state === 'online') {
                pill.classList.add('online');
                label.textContent = 'Online';
            } else if (info.state === 'offline') {
                pill.classList.add('offline');
                label.textContent = 'Offline';
            } else {
                label.textContent = 'Sin probar';
            }

            if (info.lastChangeTime) {
                const tag = info.state === 'online' ? 'Online desde' : 'Offline desde';
                lastChangeSpans[index].textContent = `${tag} ${info.lastChangeTime}`;
            }
        }

        async function checkStationHealth(index) {
            const station = stations[index];
            const info = monitorState[index];
            updateMonitorPillUI(index, 'checking');

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), CHECK_TIMEOUT_MS);

            let isUp = false;
            try {
                const res = await fetch(station.url, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store',
                    signal: controller.signal
                });
                if (res.ok) {
                    const text = await res.text();
                    // Verifica que parezca un playlist HLS válido
                    isUp = text.includes('#EXTM3U') || text.trim().length > 0;
                }
            } catch (err) {
                isUp = false;
            } finally {
                clearTimeout(timer);
            }

            const nextState = isUp ? 'online' : 'offline';
            // Solo actualiza la hora cuando cambia de estado (o en la primera lectura)
            if (info.state !== nextState || !info.lastChangeTime) {
                info.state = nextState;
                info.lastChangeTime = formatNowTime();
            } else {
                info.state = nextState;
            }

            updateMonitorPillUI(index, nextState);
        }

        async function checkAllStations() {
            // Chequea en lotes de 4 para no saturar red ni CPU
            const batchSize = 4;
            for (let i = 0; i < stations.length; i += batchSize) {
                const batch = [];
                for (let j = i; j < Math.min(i + batchSize, stations.length); j++) {
                    batch.push(checkStationHealth(j));
                }
                await Promise.all(batch);
            }
        }

        function setMonitoringEnabled(enabled) {
            const btn = document.getElementById('monitorToggleBtn');
            const dot = document.getElementById('monitorBtnDot');
            const label = document.getElementById('monitorBtnLabel');

            isMonitoring = enabled;
            if (monitorTimer) {
                clearInterval(monitorTimer);
                monitorTimer = null;
            }

            if (isMonitoring) {
                btn.classList.add('monitoring');
                dot.style.backgroundColor = 'var(--online-color)';
                dot.style.boxShadow = '0 0 8px var(--online-color)';
                label.textContent = 'Monitor: ON (30s)';
                checkAllStations();
                monitorTimer = setInterval(checkAllStations, MONITOR_INTERVAL_MS);
            } else {
                btn.classList.remove('monitoring');
                dot.style.backgroundColor = 'var(--text-muted)';
                dot.style.boxShadow = 'none';
                label.textContent = 'Monitor: OFF';
            }
        }

        document.getElementById('monitorToggleBtn').addEventListener('click', () => {
            setMonitoringEnabled(!isMonitoring);
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            checkAllStations();
        });

        // ============ HLS: UNA SOLA INSTANCIA REUTILIZABLE ============
        function ensureHls() {
            if (hls || !hlsSupported()) return hls;
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                liveSyncDurationCount: 3,
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                manifestLoadingMaxRetry: 2,
                levelLoadingMaxRetry: 3,
                fragLoadingMaxRetry: 3,
                manifestLoadingRetryDelay: 1000,
                levelLoadingRetryDelay: 1000,
                fragLoadingRetryDelay: 1000,
            });
            hls.attachMedia(audio);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if (hls._token !== playToken) return;
                if (currentIndex >= 0 && audio.paused) {
                    const p = audio.play();
                    if (p) p.catch(() => {});
                }
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (hls._token !== playToken) return;
                if (!data.fatal) return;
                console.debug('[HLS]', data.type, data.details);

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    if (retryCount < 2) {
                        retryCount++;
                        setStatus(currentIndex, `Reconectando… (${retryCount}/${MAX_RETRIES})`);
                        setTimeout(() => { if (hls && hls._token === playToken) { try { hls.startLoad(); } catch(e){} } }, 800);
                    } else {
                        scheduleRetry(currentIndex, playToken);
                    }
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    try { hls.recoverMediaError(); } catch(e) { scheduleRetry(currentIndex, playToken); }
                } else {
                    recreateHlsAndRetry(currentIndex, playToken);
                }
            });
            return hls;
        }

        function destroyHls() {
            if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
        }

        function recreateHlsAndRetry(index, token) {
            if (token !== playToken || index !== currentIndex) return;
            destroyHls();
            ensureHls();
            if (hls) {
                hls._token = token;
                hls.loadSource(stations[index].url);
                const p = audio.play();
                if (p) p.catch(() => {});
            }
        }

        function scheduleRetry(index, token) {
            if (token !== playToken || index !== currentIndex) return;
            if (retryCount >= MAX_RETRIES) {
                isConnecting = false;
                setStatus(index, 'Error al conectar • Toca de nuevo');
                syncUI();
                stopWatchdog();
                return;
            }
            retryCount++;
            const delay = Math.min(1000 * retryCount, 3000);
            setStatus(index, `Reintentando… (${retryCount}/${MAX_RETRIES})`);
            floatingStatus.textContent = `Reintentando… (${retryCount}/${MAX_RETRIES})`;

            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => {
                if (token !== playToken || index !== currentIndex) return;
                isConnecting = true;
                if (hlsSupported()) {
                    ensureHls();
                    hls._token = token;
                    hls.stopLoad();
                    hls.loadSource(stations[index].url);
                } else if (nativeHlsSupported()) {
                    audio.src = stations[index].url;
                    audio.load();
                }
                const p = audio.play();
                if (p) p.catch(() => {});
                armConnectTimeout(index, token);
            }, delay);
        }

        function armConnectTimeout(index, token) {
            clearTimeout(connectTimeout);
            connectTimeout = setTimeout(() => {
                if (token === playToken && index === currentIndex && isConnecting) {
                    scheduleRetry(index, token);
                }
            }, 10000);
        }

        function startWatchdog() {
            stopWatchdog();
            lastTime = -1;
            stallCount = 0;
            stallTimer = setInterval(() => {
                if (currentIndex < 0) return;
                if (audio.paused || audio.ended || audio.seeking) { lastTime = audio.currentTime; stallCount = 0; return; }
                if (audio.readyState === 0) return;
                if (audio.currentTime === lastTime) {
                    stallCount++;
                    if (stallCount === 1) {
                        if (hls) { try { hls.startLoad(); } catch(e){} }
                    } else if (stallCount >= 2) {
                        stallCount = 0;
                        scheduleRetry(currentIndex, playToken);
                    }
                } else {
                    stallCount = 0;
                }
                lastTime = audio.currentTime;
            }, 5000);
        }
        function stopWatchdog() {
            if (stallTimer) { clearInterval(stallTimer); stallTimer = null; }
        }

        function handlePlayTrigger(index) {
            if (currentIndex === index && (!audio.paused || isConnecting)) {
                stopStation();
                return;
            }
            playStation(index);
        }

        function playStation(index) {
            const myToken = ++playToken;
            clearTimeout(retryTimer);
            clearTimeout(connectTimeout);

            if (hls) hls.stopLoad();
            audio.pause();

            currentIndex = index;
            isConnecting = true;
            retryCount = 0;
            lastTime = -1;
            stallCount = 0;

            setStatus(index, 'Conectando…');
            floatingStatus.textContent = 'Conectando…';
            syncUI();
            updateMediaSession(index);

            if (hlsSupported()) {
                ensureHls();
                hls._token = myToken;
                hls.loadSource(stations[index].url);
            } else if (nativeHlsSupported()) {
                audio.src = stations[index].url;
                audio.load();
            } else {
                setStatus(index, 'Navegador no compatible');
                isConnecting = false;
                return;
            }

            const p = audio.play();
            if (p) p.catch((err) => {
                if (myToken !== playToken) return;
                if (err && err.name === 'NotAllowedError') setStatus(index, 'Toca ▶ de nuevo');
            });

            armConnectTimeout(index, myToken);
            startWatchdog();
        }

        function stopStation() {
            playToken++;
            clearTimeout(retryTimer);
            clearTimeout(connectTimeout);
            stopWatchdog();
            isConnecting = false;

            if (hls) hls.stopLoad();
            audio.pause();
            if (!hlsSupported() && nativeHlsSupported()) {
                audio.removeAttribute('src');
                audio.load();
            }

            if (currentIndex >= 0) setStatus(currentIndex, 'Pausado');
            currentIndex = -1;
            syncUI();
        }

        audio.addEventListener('playing', () => {
            if (currentIndex < 0) return;
            isConnecting = false;
            clearTimeout(connectTimeout);
            retryCount = 0;
            // Si está reproduciendo en vivo, también marca Online si no estaba marcado
            if (monitorState[currentIndex].state !== 'online') {
                monitorState[currentIndex].state = 'online';
                monitorState[currentIndex].lastChangeTime = formatNowTime();
                updateMonitorPillUI(currentIndex, 'online');
            }
            setStatus(currentIndex, 'En vivo');
            floatingStatus.textContent = 'En vivo';
            syncUI();
            updateMediaSession(currentIndex);
        });

        audio.addEventListener('waiting', () => {
            if (currentIndex < 0 || audio.paused) return;
            if (statusSpans[currentIndex].textContent === 'En vivo') {
                setStatus(currentIndex, 'Cargando…');
            }
        });

        function setStatus(index, text) {
            if (index < 0 || !statusSpans[index]) return;
            statusSpans[index].textContent = text;
        }

        function syncUI() {
            stations.forEach((st, i) => {
                const isCurrent = (i === currentIndex);
                const isPlaying = isCurrent && !audio.paused;
                const isConn = isCurrent && isConnecting;

                activeCards[i].classList.toggle('playing', isPlaying);
                activeCards[i].classList.toggle('connecting', isConn && !isPlaying);
                playBtns[i].innerHTML = (isPlaying || isConn) ? pauseIcon : playIcon;

                if (!isCurrent && statusSpans[i].textContent !== 'Listo') {
                    if (['En vivo', 'Conectando…', 'Cargando…', 'Pausado'].includes(statusSpans[i].textContent) ||
                        statusSpans[i].textContent.startsWith('Reintentando') ||
                        statusSpans[i].textContent.startsWith('Reconectando')) {
                        statusSpans[i].textContent = 'Listo';
                    }
                }
            });

            if (currentIndex >= 0) {
                const st = stations[currentIndex];
                floatingPlayer.classList.add('active');
                floatingTitle.textContent = st.name;
                floatingLogo.src = st.logo;
                floatingLogo.alt = st.name;
                const activeNow = !audio.paused || isConnecting;
                floatingPlayBtn.innerHTML = activeNow ? pauseIcon : playIcon;
                if (!audio.paused) floatingStatus.textContent = 'En vivo';
                else if (isConnecting) floatingStatus.textContent = statusSpans[currentIndex].textContent;
                else floatingStatus.textContent = 'Pausado';
            } else {
                floatingPlayer.classList.remove('active');
            }
        }

        floatingPlayBtn.addEventListener('click', () => {
            if (currentIndex < 0) return;
            handlePlayTrigger(currentIndex);
        });

        function toggleMute() {
            isMuted = !isMuted;
            audio.muted = isMuted;
            muteBtns.forEach(btn => {
                btn.innerHTML = isMuted ? iconMute : iconVolHigh;
                btn.classList.toggle('muted', isMuted);
            });
        }

        function updateMediaSession(index) {
            if (!('mediaSession' in navigator)) return;
            const st = stations[index];
            navigator.mediaSession.metadata = new MediaMetadata({
                title: st.name,
                artist: 'Radios Streaming - Guatemala',
                album: 'En Vivo',
                artwork: [
                    { src: st.logo, sizes: '512x512', type: 'image/png' }
                ]
            });
            navigator.mediaSession.setActionHandler('play', () => playStation(index));
            navigator.mediaSession.setActionHandler('pause', () => stopStation());
            navigator.mediaSession.setActionHandler('stop', () => stopStation());
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            stations.forEach((st, i) => {
                activeCards[i].style.display = st.name.toLowerCase().includes(q) ? '' : 'none';
            });
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && currentIndex >= 0 && !audio.paused && hls) {
                try { hls.startLoad(); } catch(e){}
            }
        });
    </script>
</body>
</html>
