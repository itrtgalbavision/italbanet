<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios Streaming - LMB Desing</title>

    <!-- Configuración PWA / GitHub Pages -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b0f19">

    <!-- Configuración para iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radios">

    <!-- Icono personalizado de la pantalla de inicio -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">

    <!-- Icono del navegador -->
    <link rel="icon" type="image/png" href="./icon.png?v=2">

    <!-- Importar Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px 100px 20px; /* Padding inferior para el reproductor flotante */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Buscador y Control de Acciones */
        .controls-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            padding: 12px 20px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Botón de actualizar página */
        .refresh-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 25px;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .refresh-btn:hover {
            border-color: var(--accent-color);
            background-color: #17233d;
            color: var(--accent-color);
        }

        .refresh-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .refresh-btn.rotating svg {
            transform: rotate(360deg);
        }

        /* Cuadrícula de estaciones */
        .grid-stations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* Fondo borroso con el logo al reproducir */
        .station-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--bg-logo);
            background-size: cover;
            background-position: center;
            opacity: 0.05;
            filter: blur(15px);
            z-index: 0;
            transition: opacity 0.3s;
        }

        .station-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .station-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            background-color: #17233d;
        }

        .station-card.playing::before {
            opacity: 0.15;
        }

        .station-card > * {
            position: relative;
            z-index: 1;
        }

        /* Contenedor del logo */
        .logo-container {
            width: 110px;
            height: 80px;
            background: #090d16;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            border: 1px solid var(--card-border);
            box-sizing: border-box;
        }

        .station-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .station-info {
            text-align: center;
            width: 100%;
        }

        .station-name {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .station-card.playing .status {
            color: #34d399;
        }

        /* Reproductor Custom Estilizado */
        .custom-player {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 30px;
            padding: 6px 14px;
            box-sizing: border-box;
            margin-top: 4px;
        }

        .play-btn {
            background-color: var(--accent-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background-color: #7dd3fc;
        }

        .play-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 65%;
        }

        .vol-btn {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: color 0.2s ease, transform 0.1s ease;
        }

        .vol-btn:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        .volume-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #334155;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        /* Barra Mini Player Inferior Opcional */
        .floating-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            padding: 12px 20px;
            box-sizing: border-box;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .floating-player.active {
            display: flex;
        }

        .floating-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .floating-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #000;
            border-radius: 8px;
            padding: 4px;
        }

        .floating-text .title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .floating-text .desc {
            font-size: 0.75rem;
            color: #34d399;
        }

        .floating-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        @media (max-width: 520px) {
            .controls-container {
                flex-direction: column;
                gap: 10px;
            }
            .search-input, .refresh-btn {
                width: 100%;
                justify-content: center;
            }
            .floating-controls .volume-container {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Radios Streaming - GUATEMALA</h1>
            <p class="subtitle">Selecciona tu estación favorita para iniciar la transmisión.</p>
        </header>

        <!-- Buscador y Botón de Actualizar -->
        <div class="controls-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora...">
            <button id="refreshBtn" class="refresh-btn" title="Actualizar Señal / Página">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                Actualizar
            </button>
        </div>

        <div class="grid-stations" id="stationsGrid"></div>
    </div>

    <!-- Mini Barra Flotante inferior -->
    <div class="floating-player" id="floatingPlayer">
        <div class="floating-info">
            <img id="floatingLogo" src="" alt="" class="floating-logo">
            <div class="floating-text">
                <div class="title" id="floatingTitle">Ninguna reproducción</div>
                <div class="desc" id="floatingStatus">En vivo</div>
            </div>
        </div>
        <div class="floating-controls">
            <div class="volume-container">
                <button class="vol-btn" id="floatingVolBtn" title="Silenciar / Activar sonido">
                    <svg class="volume-icon" viewBox="0 0 24 24"></svg>
                </button>
                <input type="range" class="volume-slider" id="floatingVolSlider" min="0" max="1" step="0.05" value="1">
            </div>
            <button class="play-btn" id="floatingPlayBtn" title="Play/Pause">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const stations = [
            { name: "Xtrema On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/8bp8yay2zaog/master.m3u8", logo: "xtrema.png" },
            { name: "La Marca On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/x9til9l95v7l/master.m3u8", logo: "lamarca.png" },
            { name: "Galaxia On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/3r10218cqvb6/master.m3u8", logo: "galaxia.png" },
            { name: "Tropicálida On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8", logo: "tropicalida.png" },
            { name: "Alfa On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/r0nwiyol2l12/master.m3u8", logo: "alfa.png" },
            { name: "Éxitos On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/yff15vi5xsxi/master.m3u8", logo: "exitos.png" },
            { name: "Fiesta FM On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/h8fdwk021ch2/master.m3u8", logo: "fiesta.png" },
            { name: "Joya On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/5zgdqpigoa9d/master.m3u8", logo: "joya.png" },
            { name: "Ranchera On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/051kh1xde9ws/master.m3u8", logo: "ranchera.png" },
            { name: "Sonora On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/6on6zmhisqhm/master.m3u8", logo: "sonora.png" },
            { name: "Éxitos XELA On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/vk54lkazkyxg/master.m3u8", logo: "exitosx.png" },
            { name: "Flix Xela On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/bc0guefb9qsv/master.m3u8", logo: "flix.png" }
        ];

        const gridContainer = document.getElementById('stationsGrid');
        const activeAudios = [];
        const activeCards = [];
        const playBtns = [];
        const statusSpans = [];
        const volumeSliders = [];
        const volumeBtns = [];
        const lastNonZeroVolumes = [];
        const hlsPlayers = [];
        let currentPlayingIndex = -1;

        // SVG Icons
        const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        const pauseIcon = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        
        // Dynamic Volume Icons
        const volHighIcon = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
        const volLowIcon = `<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>`;
        const volMuteIcon = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;

        const floatingPlayer = document.getElementById('floatingPlayer');
        const floatingPlayBtn = document.getElementById('floatingPlayBtn');
        const floatingTitle = document.getElementById('floatingTitle');
        const floatingStatus = document.getElementById('floatingStatus');
        const floatingLogo = document.getElementById('floatingLogo');
        const floatingVolBtn = document.getElementById('floatingVolBtn');
        const floatingVolSlider = document.getElementById('floatingVolSlider');

        // Render Stations
        stations.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = 'station-card';
            card.style.setProperty('--bg-logo', `url('${station.logo}')`);
            card.setAttribute('data-name', station.name.toLowerCase());
            card.innerHTML = `
                <div class="logo-container">
                    <img src="${station.logo}" alt="${station.name}" class="station-logo" onerror="this.src='https://via.placeholder.com/100x60?text=RADIO'">
                </div>
                <div class="station-info">
                    <div class="station-name">${station.name}</div>
                    <div class="status" id="status-${index}">Conectado</div>
                </div>
                <audio id="audio-${index}" preload="none"></audio>
                <div class="custom-player">
                    <button class="play-btn" id="btn-${index}" title="Reproducir" aria-label="Reproducir ${station.name}">${playIcon}</button>
                    <div class="volume-container">
                        <button class="vol-btn" id="volBtn-${index}" title="Silenciar / Activar sonido" aria-label="Silenciar ${station.name}">
                            <svg class="volume-icon" viewBox="0 0 24 24">${volHighIcon}</svg>
                        </button>
                        <input type="range" class="volume-slider" id="vol-${index}" min="0" max="1" step="0.05" value="1" aria-label="Volumen de ${station.name}">
                    </div>
                </div>`;
            gridContainer.appendChild(card);

            const audio = card.querySelector('audio');
            const button = card.querySelector('.play-btn');
            const volume = card.querySelector('.volume-slider');
            const volBtn = card.querySelector('.vol-btn');
            const status = card.querySelector('.status');

            audio.volume = 1;
            lastNonZeroVolumes.push(1);
            activeAudios.push(audio);
            activeCards.push(card);
            playBtns.push(button);
            statusSpans.push(status);
            volumeSliders.push(volume);
            volumeBtns.push(volBtn);

            // Setup HLS
            if (window.Hls && Hls.isSupported()) {
                const hls = new Hls({
                    liveSyncDurationCount: 3,
                    maxLiveSyncPlaybackRate: 1.1,
                    enableWorker: true
                });
                hls.loadSource(station.url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.ERROR, (_event, data) => {
                    if (data.fatal) {
                        status.textContent = 'Error de transmisión';
                        if (currentPlayingIndex === index) floatingStatus.textContent = 'Error de transmisión';
                        hls.destroy();
                    }
                });
                hlsPlayers[index] = hls;
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = station.url;
            }

            // Click Play / Pause Card
            button.addEventListener('click', () => {
                if (currentPlayingIndex === index && !audio.paused) {
                    pauseStation(index);
                } else {
                    playStation(index);
                }
            });

            // Volume Slider Event
            volume.addEventListener('input', event => {
                const val = Number(event.target.value);
                setStationVolume(index, val);
            });

            // Mute / Unmute Toggle Button Event
            volBtn.addEventListener('click', () => {
                toggleMute(index);
            });

            // Audio Events
            audio.addEventListener('playing', () => {
                currentPlayingIndex = index;
                saveCurrentState(index, true);
                syncInterface();
                status.textContent = 'En vivo';
                floatingStatus.textContent = 'En vivo';
                updateMediaSession(index);
            });

            audio.addEventListener('play', () => {
                currentPlayingIndex = index;
                syncInterface();
            });

            audio.addEventListener('pause', () => {
                if (currentPlayingIndex === index) {
                    saveCurrentState(index, false);
                }
                syncInterface();
            });

            audio.addEventListener('waiting', () => {
                if (currentPlayingIndex === index) {
                    status.textContent = 'Conectando…';
                    floatingStatus.textContent = 'Conectando…';
                }
            });

            audio.addEventListener('error', () => {
                status.textContent = 'Error de reproducción';
                if (currentPlayingIndex === index) floatingStatus.textContent = 'Error de reproducción';
                syncInterface();
            });
        });

        // Volume Management
        function setStationVolume(index, val) {
            const audio = activeAudios[index];
            audio.volume = val;
            volumeSliders[index].value = val;

            if (val > 0) {
                lastNonZeroVolumes[index] = val;
            }

            updateVolumeIcon(index, val);

            // Sync floating volume if this is the active playing station
            if (currentPlayingIndex === index) {
                floatingVolSlider.value = val;
                updateFloatingVolumeIcon(val);
            }
        }

        function toggleMute(index) {
            const audio = activeAudios[index];
            if (audio.volume > 0) {
                setStationVolume(index, 0);
            } else {
                const restoreVal = lastNonZeroVolumes[index] || 1;
                setStationVolume(index, restoreVal);
            }
        }

        function updateVolumeIcon(index, val) {
            const volBtnSvg = volumeBtns[index].querySelector('svg');
            if (val === 0) {
                volBtnSvg.innerHTML = volMuteIcon;
            } else if (val <= 0.5) {
                volBtnSvg.innerHTML = volLowIcon;
            } else {
                volBtnSvg.innerHTML = volHighIcon;
            }
        }

        function updateFloatingVolumeIcon(val) {
            const svg = floatingVolBtn.querySelector('svg');
            if (val === 0) {
                svg.innerHTML = volMuteIcon;
            } else if (val <= 0.5) {
                svg.innerHTML = volLowIcon;
            } else {
                svg.innerHTML = volHighIcon;
            }
        }

        // Floating Player Volume Controls
        floatingVolSlider.addEventListener('input', e => {
            if (currentPlayingIndex >= 0) {
                setStationVolume(currentPlayingIndex, Number(e.target.value));
            }
        });

        floatingVolBtn.addEventListener('click', () => {
            if (currentPlayingIndex >= 0) {
                toggleMute(currentPlayingIndex);
            }
        });

        // Play Station with Live Edge Synchronization
        async function playStation(index) {
            const targetAudio = activeAudios[index];
            const station = stations[index];

            // Pause all other stations
            activeAudios.forEach((audio, i) => {
                if (i !== index && !audio.paused) audio.pause();
            });

            currentPlayingIndex = index;
            syncInterface();
            statusSpans[index].textContent = 'Conectando…';
            floatingStatus.textContent = 'Conectando…';

            // FORCE RE-CONNECT TO LIVE EDGE (No old buffer playback)
            if (hlsPlayers[index]) {
                const hls = hlsPlayers[index];
                hls.stopLoad();
                hls.startLoad();
                if (hls.liveSyncPosition) {
                    targetAudio.currentTime = hls.liveSyncPosition;
                }
            } else if (targetAudio.canPlayType('application/vnd.apple.mpegurl')) {
                targetAudio.src = station.url + '?t=' + Date.now();
                targetAudio.load();
            }

            try {
                await targetAudio.play();
                saveCurrentState(index, true);
                syncInterface();
            } catch (error) {
                console.error('Error al reproducir:', error);
                statusSpans[index].textContent = 'Haz clic para reproducir';
                floatingStatus.textContent = 'Interacción requerida';
                syncInterface();
            }
        }

        function pauseStation(index) {
            if (activeAudios[index]) {
                activeAudios[index].pause();
                saveCurrentState(index, false);
            }
        }

        // Save State in localStorage so Reload Resumes Correctly
        function saveCurrentState(index, isPlaying) {
            try {
                localStorage.setItem('lmb_last_station', index);
                localStorage.setItem('lmb_was_playing', isPlaying ? 'true' : 'false');
            } catch (e) {
                console.debug('Storage error:', e);
            }
        }

        // UI Synchronization
        function syncInterface() {
            activeAudios.forEach((audio, index) => {
                const isPlaying = !audio.paused && !audio.ended;
                activeCards[index].classList.toggle('playing', isPlaying);
                playBtns[index].innerHTML = isPlaying ? pauseIcon : playIcon;
                playBtns[index].title = isPlaying ? 'Pausar' : 'Reproducir';
                playBtns[index].setAttribute('aria-label', `${isPlaying ? 'Pausar' : 'Reproducir'} ${stations[index].name}`);

                if (!isPlaying && (statusSpans[index].textContent === 'En vivo' || statusSpans[index].textContent === 'Reproduciendo')) {
                    statusSpans[index].textContent = 'Pausado';
                }
            });

            if (currentPlayingIndex < 0) {
                floatingPlayer.classList.remove('active');
                return;
            }

            const selectedAudio = activeAudios[currentPlayingIndex];
            const selectedStation = stations[currentPlayingIndex];
            const isSelectedPlaying = !selectedAudio.paused && !selectedAudio.ended;

            floatingLogo.src = selectedStation.logo;
            floatingLogo.alt = selectedStation.name;
            floatingTitle.textContent = selectedStation.name;
            floatingStatus.textContent = isSelectedPlaying ? 'En vivo' : 'Pausado';
            floatingPlayBtn.innerHTML = isSelectedPlaying ? pauseIcon : playIcon;
            floatingPlayBtn.title = isSelectedPlaying ? 'Pausar' : 'Reproducir';
            
            // Sync floating player volume with active station volume
            floatingVolSlider.value = selectedAudio.volume;
            updateFloatingVolumeIcon(selectedAudio.volume);

            floatingPlayer.classList.add('active');
        }

        floatingPlayBtn.addEventListener('click', () => {
            if (currentPlayingIndex < 0) return;
            const audio = activeAudios[currentPlayingIndex];
            if (audio.paused) {
                playStation(currentPlayingIndex);
            } else {
                pauseStation(currentPlayingIndex);
            }
        });

        function updateMediaSession(index) {
            if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
            const station = stations[index];

            navigator.mediaSession.metadata = new MediaMetadata({
                title: station.name,
                artist: 'Radios Streaming - Guatemala',
                album: 'LMB Desing',
                artwork: [{ src: station.logo, sizes: '192x192', type: 'image/png' }]
            });

            try {
                navigator.mediaSession.setActionHandler('play', () => {
                    if (currentPlayingIndex >= 0) playStation(currentPlayingIndex);
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    if (currentPlayingIndex >= 0) pauseStation(currentPlayingIndex);
                });
            } catch (error) {
                console.debug('Media Session no disponible:', error);
            }
        }

        // Buscador
        document.getElementById('searchInput').addEventListener('input', event => {
            const query = event.target.value.toLowerCase().trim();
            activeCards.forEach((card, index) => {
                card.style.display = stations[index].name.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        });

        // Botón Actualizar
        document.getElementById('refreshBtn').addEventListener('click', function() {
            this.classList.add('rotating');
            location.reload();
        });

        // Auto-Resume on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            const savedIndex = localStorage.getItem('lmb_last_station');
            const wasPlaying = localStorage.getItem('lmb_was_playing') === 'true';

            if (savedIndex !== null && stations[savedIndex]) {
                const idx = parseInt(savedIndex, 10);
                currentPlayingIndex = idx;
                syncInterface();

                if (wasPlaying) {
                    // Intenta auto-reproducir inmediatamente
                    playStation(idx).catch(() => {
                        // Si el navegador bloquea autoplay en recarga limpia
                        statusSpans[idx].textContent = 'Toca para continuar';
                        floatingStatus.textContent = 'Toca para continuar';
                    });
                } else {
                    statusSpans[idx].textContent = 'Pausado';
                    floatingStatus.textContent = 'Pausado';
                }
            }
        });
    </script>
</body>
</html>
