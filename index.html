<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios Streaming - LMB Design</title>

    <!-- Configuración PWA / GitHub Pages -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b0f19">

    <!-- Configuración para iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radios">

    <!-- Iconos personalizados -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" href="./icon.png?v=2">

    <!-- Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Importar Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-color: #080c14;
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Card estilo Ned-Player / Chapín Radio */
        .ned-card {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background-color: #0b1120;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .ned-card:hover {
            transform: translateY(-6px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.15);
        }

        .ned-card.playing {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3), 0 15px 35px rgba(0,0,0,0.6);
        }

        /* Fondo Difuminado con el mismo Logo de la Estación */
        .ned-poster-bg {
            position: absolute;
            inset: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            object-fit: cover;
            filter: blur(16px) brightness(0.4) saturate(1.3);
            transition: transform 0.6s ease, filter 0.6s ease;
            z-index: 0;
            user-select: none;
        }

        .ned-card:hover .ned-poster-bg {
            transform: scale(1.06);
            filter: blur(12px) brightness(0.45) saturate(1.4);
        }

        .ned-card.playing .ned-poster-bg {
            filter: blur(14px) brightness(0.5) saturate(1.5);
        }

        /* Overlay Gradiente */
        .ned-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg, 
                rgba(8, 12, 20, 0.75) 0%, 
                rgba(8, 12, 20, 0.3) 40%, 
                rgba(8, 12, 20, 0.85) 80%,
                rgba(8, 12, 20, 0.95) 100%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* Insignia EN VIVO */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .ned-card.playing .live-dot {
            background-color: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Contenedor central de Logo + Botón Play (Media-Chrome style) */
        .centered-chrome {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding-top: 20px;
        }

        /* Logo destacado central */
        .logo-box {
            width: 110px;
            height: 80px;
            background: rgba(10, 15, 26, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .ned-card:hover .logo-box {
            transform: scale(1.05);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .station-logo-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Botón Play/Pause Central Ned-Player */
        .centered-play-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .centered-play-btn:hover {
            transform: scale(1.12);
            background: rgba(56, 189, 248, 0.9);
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        }

        .ned-card.playing .centered-play-btn {
            background: rgba(56, 189, 248, 0.9);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        /* Media Control Bar (Parte inferior) */
        .media-control-bar {
            position: relative;
            z-index: 2;
            background: rgba(10, 15, 26, 0.88);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        /* Slider de Volumen */
        .media-volume-range {
            -webkit-appearance: none;
            appearance: none;
            width: 75px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .media-volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
        }

        /* Animación Ecualizador */
        .eq-container {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
        }

        .eq-bar {
            width: 3px;
            background-color: var(--accent-cyan);
            border-radius: 2px;
            animation: eq-bounce 1.2s ease-in-out infinite alternate;
        }

        .eq-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 16px; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 8px;  animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 14px; animation-delay: 0.4s; }

        @keyframes eq-bounce {
            0% { transform: scaleY(0.25); }
            100% { transform: scaleY(1.1); }
        }

        .paused .eq-bar {
            animation: none !important;
            height: 4px !important;
            opacity: 0.3;
        }
    </style>
</head>
<body class="pb-28 pt-8 px-4 sm:px-8 max-w-7xl mx-auto">

    <!-- Encabezado estilo Chapín Radio -->
    <header class="text-center mb-10 relative">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold mb-4 backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            TRANSMISIÓN EN VIVO
        </div>
        <h1 class="text-3xl sm:text-5xl font-black tracking-tight bg-gradient-to-r from-sky-400 via-indigo-300 to-sky-200 bg-clip-text text-transparent mb-3">
            Radios Streaming - GUATEMALA
        </h1>
        <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto font-medium">
            Selecciona tu estación favorita para iniciar la transmisión.
        </p>

        <!-- Barra de Búsqueda -->
        <div class="mt-6 max-w-md mx-auto relative">
            <input type="text" id="searchInput" placeholder="Buscar emisora por nombre..." 
                class="w-full bg-slate-900/90 border border-slate-800 text-slate-100 rounded-2xl px-11 py-3 text-sm focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all placeholder:text-slate-500 shadow-xl">
            <svg class="w-5 h-5 absolute left-3.5 top-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <button id="clearSearch" class="hidden absolute right-3.5 top-3.5 text-slate-500 hover:text-slate-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></button>
        </div>
    </header>

    <!-- Grilla de Reproductores Ned-Player con Logo de Fondo -->
    <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="stationsGrid"></main>

    <!-- Mensaje si no hay resultados -->
    <div id="noResults" class="hidden text-center py-16">
        <div class="inline-flex p-4 rounded-full bg-slate-900/60 mb-4 text-slate-400 border border-slate-800">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
        </div>
        <h3 class="text-lg font-bold text-slate-200">No se encontraron emisoras</h3>
        <p class="text-slate-400 text-sm mt-1">Intenta buscar otro nombre de radio.</p>
    </div>

    <!-- Barra Inferior Global (Sticky Mini Player) -->
    <div id="globalPlayerBar" class="fixed bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-800 backdrop-blur-xl px-5 py-3 transform translate-y-full transition-transform duration-300 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-lg bg-slate-900 p-1 border border-slate-800 flex-shrink-0 flex items-center justify-center">
                    <img id="globalPoster" src="" alt="Logo" class="max-w-full max-h-full object-contain">
                </div>
                <div class="min-w-0">
                    <h4 id="globalName" class="text-sm font-bold text-slate-100 truncate">Estación Seleccionada</h4>
                    <span id="globalStatus" class="text-xs text-sky-400 font-semibold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span> Reproduciendo en vivo
                    </span>
                </div>
            </div>

            <!-- Botón Global Play/Pause -->
            <button id="globalPlayBtn" class="w-11 h-11 rounded-full bg-sky-500 text-slate-950 flex items-center justify-center font-bold hover:bg-sky-400 transition-all flex-shrink-0 shadow-lg">
                <svg class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        const stations = [
            { name: "Extrema", url: "https://ddycmnicl95kp.cloudfront.net/live/8bp8yay2zaog/master.m3u8", logo: "xtrema.png" },
            { name: "La Marca", url: "https://ddycmnicl95kp.cloudfront.net/live/x9til9l95v7l/master.m3u8", logo: "lamarca.png" },
            { name: "Galaxia", url: "https://ddycmnicl95kp.cloudfront.net/live/3r10218cqvb6/master.m3u8", logo: "galaxia.png" },
            { name: "Tropicálida", url: "https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8", logo: "tropicalida.png" },
            { name: "Alfa", url: "https://ddycmnicl95kp.cloudfront.net/live/r0nwiyol2l12/master.m3u8", logo: "alfa.png" },
            { name: "Éxitos Capital", url: "https://ddycmnicl95kp.cloudfront.net/live/yff15vi5xsxi/master.m3u8", logo: "exitos.png" },
            { name: "Éxitos XELA", url: "https://ddycmnicl95kp.cloudfront.net/live/vk54lkazkyxg/master.m3u8", logo: "exitosx.png" },
            { name: "Fiesta FM", url: "https://ddycmnicl95kp.cloudfront.net/live/h8fdwk021ch2/master.m3u8", logo: "fiesta.png" },
            { name: "Flix Xela", url: "https://ddycmnicl95kp.cloudfront.net/live/bc0guefb9qsv/master.m3u8", logo: "flix.png" },
            { name: "Joya", url: "https://ddycmnicl95kp.cloudfront.net/live/5zgdqpigoa9d/master.m3u8", logo: "joya.png" },
            { name: "Ranchera", url: "https://ddycmnicl95kp.cloudfront.net/live/051kh1xde9ws/master.m3u8", logo: "ranchera.png" },
            { name: "Sonora", url: "https://ddycmnicl95kp.cloudfront.net/live/6on6zmhisqhm/master.m3u8", logo: "sonora.png" }
        ];

        const gridContainer = document.getElementById('stationsGrid');
        const activeAudios = [];
        const activeCards = [];
        const playBtns = [];
        let currentlyPlayingIndex = -1;

        // SVG Icons
        const playSVG = `<svg class="w-7 h-7 fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        const pauseSVG = `<svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        const volHighSVG = `<svg class="w-4 h-4 text-slate-300 hover:text-sky-400 cursor-pointer transition-colors" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        const volMuteSVG = `<svg class="w-4 h-4 text-rose-400 hover:text-rose-300 cursor-pointer transition-colors" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        // Construir Tarjetas Ned-Player con Logo como Fondo y en el centro
        stations.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = 'ned-card';

            const fallbackImg = `https://via.placeholder.com/150?text=${encodeURIComponent(station.name)}`;

            card.innerHTML = `
                <!-- Logo como Fondo Difuminado (Poster Background) -->
                <img src="./${station.logo}" alt="" class="ned-poster-bg" aria-hidden="true" onerror="this.onerror=null; this.src='${station.logo}'; this.onerror=()=>this.src='${fallbackImg}';">
                <div class="ned-overlay"></div>

                <!-- Insignia En Vivo y Nombre -->
                <div class="p-4 relative z-10 flex justify-between items-start gap-2">
                    <div class="live-badge">
                        <span class="live-dot"></span>
                        <span id="badge-text-${index}">CONECTADO</span>
                    </div>
                    <span class="text-xs font-bold text-slate-200 bg-slate-950/70 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/10 truncate max-w-[130px]">
                        ${station.name}
                    </span>
                </div>

                <!-- Logo Central Prominente + Botón Play (Estilo Ned-Player) -->
                <div class="centered-chrome">
                    <div class="logo-box">
                        <img src="./${station.logo}" alt="${station.name}" class="station-logo-img" onerror="this.onerror=null; this.src='${station.logo}'; this.onerror=()=>this.src='${fallbackImg}';">
                    </div>
                    <button class="centered-play-btn" id="btn-${index}" title="Reproducir ${station.name}" aria-label="Reproducir">
                        ${playSVG}
                    </button>
                </div>

                <!-- Barra de control inferior (media-control-bar) -->
                <div class="media-control-bar">
                    <div class="flex items-center gap-2">
                        <button id="mute-btn-${index}">${volHighSVG}</button>
                        <input type="range" class="media-volume-range" id="vol-${index}" min="0" max="1" step="0.05" value="1">
                    </div>

                    <!-- Ecualizador Animado -->
                    <div class="eq-container paused" id="eq-${index}">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>
                </div>

                <!-- Audio HLS -->
                <audio id="audio-${index}" preload="none"></audio>
            `;

            gridContainer.appendChild(card);

            const audioElement = document.getElementById(`audio-${index}`);
            const btnElement = document.getElementById(`btn-${index}`);
            const volElement = document.getElementById(`vol-${index}`);
            const muteBtn = document.getElementById(`mute-btn-${index}`);
            const badgeText = document.getElementById(`badge-text-${index}`);
            const eqElement = document.getElementById(`eq-${index}`);

            audioElement.volume = 1.0;
            let lastVolume = 1.0;

            activeAudios.push(audioElement);
            activeCards.push(card);
            playBtns.push(btnElement);

            let hlsInstance = null;

            function initHls() {
                if (hlsInstance) return;
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({ enableWorker: true });
                    hlsInstance.loadSource(station.url);
                    hlsInstance.attachMedia(audioElement);
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            badgeText.textContent = "ERROR";
                        }
                    });
                } else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
                    audioElement.src = station.url;
                }
            }

            // Manejo de Play / Pause exclusivo
            btnElement.addEventListener('click', () => {
                initHls();

                if (audioElement.paused) {
                    // Pausar cualquier otra estación
                    activeAudios.forEach((el, i) => {
                        if (i !== index) {
                            el.pause();
                            activeCards[i].classList.remove('playing');
                            playBtns[i].innerHTML = playSVG;
                            document.getElementById(`badge-text-${i}`).textContent = "CONECTADO";
                            document.getElementById(`eq-${i}`).classList.add('paused');
                        }
                    });

                    audioElement.play().then(() => {
                        card.classList.add('playing');
                        btnElement.innerHTML = pauseSVG;
                        badgeText.textContent = "REPRODUCIENDO";
                        eqElement.classList.remove('paused');
                        currentlyPlayingIndex = index;
                        updateGlobalPlayer(station, true);
                    }).catch(err => {
                        console.error("Error al reproducir audio:", err);
                        badgeText.textContent = "ERROR";
                    });
                } else {
                    audioElement.pause();
                    card.classList.remove('playing');
                    btnElement.innerHTML = playSVG;
                    badgeText.textContent = "PAUSADO";
                    eqElement.classList.add('paused');
                    updateGlobalPlayer(station, false);
                }
            });

            // Control de volumen
            volElement.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                audioElement.volume = val;
                if (val === 0) {
                    muteBtn.innerHTML = volMuteSVG;
                } else {
                    muteBtn.innerHTML = volHighSVG;
                    lastVolume = val;
                }
            });

            muteBtn.addEventListener('click', () => {
                if (audioElement.volume > 0) {
                    lastVolume = audioElement.volume;
                    audioElement.volume = 0;
                    volElement.value = 0;
                    muteBtn.innerHTML = volMuteSVG;
                } else {
                    audioElement.volume = lastVolume || 1.0;
                    volElement.value = lastVolume || 1.0;
                    muteBtn.innerHTML = volHighSVG;
                }
            });
        });

        // Filtrado por Búsqueda
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const noResults = document.getElementById('noResults');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            let matches = 0;

            clearSearch.classList.toggle('hidden', query.length === 0);

            stations.forEach((station, i) => {
                const card = activeCards[i];
                if (station.name.toLowerCase().includes(query)) {
                    card.style.display = 'flex';
                    matches++;
                } else {
                    card.style.display = 'none';
                }
            });

            noResults.classList.toggle('hidden', matches > 0);
        });

        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            clearSearch.classList.add('hidden');
            noResults.classList.add('hidden');
            activeCards.forEach(card => card.style.display = 'flex');
        });

        // Mini Player Flotante Global
        const globalPlayerBar = document.getElementById('globalPlayerBar');
        const globalPoster = document.getElementById('globalPoster');
        const globalName = document.getElementById('globalName');
        const globalPlayBtn = document.getElementById('globalPlayBtn');

        function updateGlobalPlayer(station, isPlaying) {
            globalPlayerBar.classList.remove('translate-y-full');
            globalPoster.src = `./${station.logo}`;
            globalPoster.onerror = () => { globalPoster.src = station.logo; };
            globalName.textContent = station.name;

            globalPlayBtn.innerHTML = isPlaying 
                ? `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
                : `<svg class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        }

        globalPlayBtn.addEventListener('click', () => {
            if (currentlyPlayingIndex !== -1) {
                playBtns[currentlyPlayingIndex].click();
            }
        });
    </script>
</body>
</html>
