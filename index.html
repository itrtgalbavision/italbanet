<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Audio HLS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }
        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .status-msg {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="header">
            <h2 class="title">Señal en Vivo</h2>
            <div class="live-badge">
                <span class="live-dot"></span> En vivo
            </div>
        </div>

        <!-- Usamos un elemento de audio en lugar de video ya que es una transmisión de radio/audio -->
        <audio id="audioPlayer" controls></audio>
        
        <div id="status" class="status-msg">Conectando al streaming...</div>
    </div>

    <!-- Librería hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const audio = document.getElementById('audioPlayer');
        const statusDiv = document.getElementById('status');
        const streamUrl = 'https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(audio);

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                statusDiv.textContent = "Transmisión lista. Haz clic en reproducir.";
                // Nota: Los navegadores modernos bloquean el autoplay con sonido, 
                // por lo que el usuario suele tener que dar Play manualmente.
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            statusDiv.textContent = "Error de red. Intentando reconectar...";
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            statusDiv.textContent = "Error de medios. Recuperando...";
                            hls.recoverMediaError();
                            break;
                        default:
                            statusDiv.textContent = "Error crítico de reproducción (posible bloqueo CORS).";
                            hls.destroy();
                            break;
                    }
                }
            });
        } 
        // Compatibilidad nativa (ej. Safari)
        else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
            audio.src = streamUrl;
            audio.addEventListener('loadedmetadata', function () {
                statusDiv.textContent = "Listo para reproducir.";
            });
        } else {
            statusDiv.textContent = "Tu navegador no soporta reproducción HLS.";
        }
    </script>
</body>
</html>
