<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios en Vivo - HLS</title>
    <!-- Importar Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 24px;
            color: #38bdf8;
        }
        .station-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .station-name {
            font-weight: 600;
            font-size: 1rem;
        }
        audio {
            width: 100%;
            height: 35px;
        }
        .status {
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Radios en Vivo</h1>
        <div id="stationsList"></div>
    </div>

    <script>
        // Lista ordenada alfabéticamente
        const stations = [
            { name: "Alfa", url: "https://ddycmnicl95kp.cloudfront.net/live/r0nwiyol2l12/master.m3u8" },
            { name: "Exitos 90.9", url: "https://ddycmnicl95kp.cloudfront.net/live/yff15vi5xsxi/master.m3u8" },
            { name: "Exitos 107.1", url: "https://ddycmnicl95kp.cloudfront.net/live/vk54lkazkyxg/master.m3u8" },
            { name: "Extrema", url: "https://ddycmnicl95kp.cloudfront.net/live/8bp8yay2zaog/master.m3u8" },
            { name: "Fiesta FM", url: "https://ddycmnicl95kp.cloudfront.net/live/h8fdwk021ch2/master.m3u8" },
            { name: "Flix 93.9", url: "https://ddycmnicl95kp.cloudfront.net/live/bc0guefb9qsv/master.m3u8" },
            { name: "Galaxia", url: "https://ddycmnicl95kp.cloudfront.net/live/3r10218cqvb6/master.m3u8" },
            { name: "Joya", url: "https://ddycmnicl95kp.cloudfront.net/live/5zgdqpigoa9d/master.m3u8" },
            { name: "La Marca", url: "https://ddycmnicl95kp.cloudfront.net/live/x9til9l95v7l/master.m3u8" },
            { name: "Ranchera", url: "https://ddycmnicl95kp.cloudfront.net/live/051kh1xde9ws/master.m3u8" },
            { name: "Sonora", url: "https://ddycmnicl95kp.cloudfront.net/live/6on6zmhisqhm/master.m3u8" },
            { name: "Tropicálida", url: "https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8" }
        ];

        const listContainer = document.getElementById('stationsList');
        const audioElements = [];

        stations.forEach((station, index) => {
            // Crear elementos HTML para cada estación
            const card = document.createElement('div');
            card.className = 'station-card';

            card.innerHTML = `
                <div class="station-header">
                    <span class="station-name">${station.name}</span>
                    <span class="status" id="status-${index}">Listo</span>
                </div>
                <audio id="audio-${index}" controls></audio>
            `;

            listContainer.appendChild(card);

            const audioElement = document.getElementById(`audio-${index}`);
            const statusSpan = document.getElementById(`status-${index}`);
            audioElements.push(audioElement);

            // Lógica para pausar las demás cuando una empieza a sonar
            audioElement.addEventListener('play', () => {
                audioElements.forEach((el, i) => {
                    if (i !== index) {
                        el.pause();
                    }
                });
            });

            // Configurar HLS para cada reproductor
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(station.url);
                hls.attachMedia(audioElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    statusSpan.textContent = "Conectado";
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        statusSpan.textContent = "Error de señal";
                    }
                });
            } else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
                // Soporte nativo (Safari / iOS)
                audioElement.src = station.url;
                statusSpan.textContent = "Conectado (Nativo)";
            }
        });
    </script>
</body>
</html>
