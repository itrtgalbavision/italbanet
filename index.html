<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios Streaming - LMB Desing</title>

    <!-- Configuración PWA / GitHub Pages -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b0f19">

    <!-- Configuración para iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radios">

    <!-- Icono personalizado de la pantalla de inicio -->
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="./apple-touch-icon.png?v=2">

    <!-- Icono del navegador -->
    <link rel="icon"
          type="image/png"
          href="./icon.png?v=2">


    <!-- Importar Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Cuadrícula de estaciones */
        .grid-stations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            position: relative;
        }

        .station-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .station-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            background-color: #17233d;
        }

        /* Contenedor del logo ajustado para no recortar */
        .logo-container {
            width: 110px;
            height: 80px;
            background: #090d16;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            border: 1px solid var(--card-border);
            box-sizing: border-box;
        }

        .station-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .station-info {
            text-align: center;
            width: 100%;
        }

        .station-name {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .station-card.playing .status {
            color: #34d399;
        }

        /* Reproductor Custom Estilizado */
        .custom-player {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 30px;
            padding: 6px 14px;
            box-sizing: border-box;
            margin-top: 4px;
        }

        .play-btn {
            background-color: var(--accent-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background-color: #7dd3fc;
        }

        .play-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 60%;
        }

        .volume-icon {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
            flex-shrink: 0;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #334155;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Radios Streaming - LMB Desing</h1>
            <p class="subtitle">Selecciona tu estación favorita para iniciar la transmisión.</p>
        </header>

        <div class="grid-stations" id="stationsGrid"></div>
    </div>

    <script>
        const stations = [
            { name: "Extrema", url: "https://ddycmnicl95kp.cloudfront.net/live/8bp8yay2zaog/master.m3u8", logo: "xtrema.png" },
            { name: "La Marca", url: "https://ddycmnicl95kp.cloudfront.net/live/x9til9l95v7l/master.m3u8", logo: "lamarca.png" },
            { name: "Galaxia", url: "https://ddycmnicl95kp.cloudfront.net/live/3r10218cqvb6/master.m3u8", logo: "galaxia.png" },
            { name: "Tropicálida", url: "https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8", logo: "tropicalida.png" },
            { name: "Alfa", url: "https://ddycmnicl95kp.cloudfront.net/live/r0nwiyol2l12/master.m3u8", logo: "alfa.png" },
            { name: "Éxitos Capital", url: "https://ddycmnicl95kp.cloudfront.net/live/yff15vi5xsxi/master.m3u8", logo: "exitos.png" },
            { name: "Éxitos XELA", url: "https://ddycmnicl95kp.cloudfront.net/live/vk54lkazkyxg/master.m3u8", logo: "exitosx.png" },
            { name: "Fiesta FM", url: "https://ddycmnicl95kp.cloudfront.net/live/h8fdwk021ch2/master.m3u8", logo: "fiesta.png" },
            { name: "Flix Xela", url: "https://ddycmnicl95kp.cloudfront.net/live/bc0guefb9qsv/master.m3u8", logo: "flix.png" },
            { name: "Joya", url: "https://ddycmnicl95kp.cloudfront.net/live/5zgdqpigoa9d/master.m3u8", logo: "joya.png" },
            { name: "Ranchera", url: "https://ddycmnicl95kp.cloudfront.net/live/051kh1xde9ws/master.m3u8", logo: "ranchera.png" },
            { name: "Sonora", url: "https://ddycmnicl95kp.cloudfront.net/live/6on6zmhisqhm/master.m3u8", logo: "sonora.png" }
        ];

        const gridContainer = document.getElementById('stationsGrid');
        const activeAudios = [];
        const activeCards = [];
        const playBtns = [];

        // SVG Icons
        const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        const pauseIcon = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        const volIcon = `<svg class="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;

        stations.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = 'station-card';

            card.innerHTML = `
                <div class="logo-container">
                    <img src="${station.logo}" alt="${station.name}" class="station-logo" onerror="this.src='https://via.placeholder.com/100x60?text=RADIO'">
                </div>
                <div class="station-info">
                    <div class="station-name">${station.name}</div>
                    <div class="status" id="status-${index}">Conectado</div>
                </div>
                
                <!-- Reproductor HTML5 -->
                <audio id="audio-${index}"></audio>

                <!-- UI de reproductor custom -->
                <div class="custom-player">
                    <button class="play-btn" id="btn-${index}" title="Reproducir">${playIcon}</button>
                    <div class="volume-container">
                        ${volIcon}
                        <input type="range" class="volume-slider" id="vol-${index}" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>
            `;

            gridContainer.appendChild(card);

            const audioElement = document.getElementById(`audio-${index}`);
            const btnElement = document.getElementById(`btn-${index}`);
            const volElement = document.getElementById(`vol-${index}`);
            const statusSpan = document.getElementById(`status-${index}`);

            // Volumen inicial al 100%
            audioElement.volume = 1.0;

            activeAudios.push(audioElement);
            activeCards.push(card);
            playBtns.push(btnElement);

            // Cargar HLS
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(station.url);
                hls.attachMedia(audioElement);
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) statusSpan.textContent = "Error";
                });
            } else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
                audioElement.src = station.url;
            }

            // Lógica de Play/Pause con UI personalizada
            btnElement.addEventListener('click', () => {
                if (audioElement.paused) {
                    // Pausar las demás radios
                    activeAudios.forEach((el, i) => {
                        if (i !== index) {
                            el.pause();
                            activeCards[i].classList.remove('playing');
                            playBtns[i].innerHTML = playIcon;
                            document.getElementById(`status-${i}`).textContent = "Conectado";
                        }
                    });

                    audioElement.play();
                    card.classList.add('playing');
                    btnElement.innerHTML = pauseIcon;
                    statusSpan.textContent = "Reproduciendo";
                } else {
                    audioElement.pause();
                    card.classList.remove('playing');
                    btnElement.innerHTML = playIcon;
                    statusSpan.textContent = "Pausado";
                }
            });

            // Control de volumen
            volElement.addEventListener('input', (e) => {
                audioElement.volume = e.target.value;
            });
        });
    </script>
</body>
</html>
