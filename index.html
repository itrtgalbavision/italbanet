<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radios Streaming - LMB Desing</title>

    <!-- Configuración PWA / GitHub Pages -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b0f19">

    <!-- Configuración para iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radios">

    <!-- Iconos -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" href="./icon.png?v=2">

    <!-- Importar Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px 100px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        /* Buscador y Botón de Actualizar */
        .controls-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            padding: 12px 18px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .refresh-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 25px;
            padding: 11px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .refresh-btn:active {
            transform: scale(0.96);
            background-color: #17233d;
        }

        .refresh-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Cuadrícula de estaciones */
        .grid-stations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .station-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            background-color: #17233d;
        }

        .logo-container {
            width: 100px;
            height: 75px;
            background: #090d16;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px;
            border: 1px solid var(--card-border);
        }

        .station-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .station-info {
            text-align: center;
            width: 100%;
        }

        .station-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .station-card.playing .status {
            color: #34d399;
        }

        /* Controles de reproducción y volumen optimizados */
        .custom-player {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 30px;
            padding: 6px 12px;
            box-sizing: border-box;
            gap: 8px;
        }

        .play-btn {
            background-color: var(--accent-color);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .play-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Botones táctiles de volumen rápido para móviles */
        .vol-btn-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #1e293b;
            padding: 3px;
            border-radius: 20px;
        }

        .vol-step-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 8px;
            border-radius: 14px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .vol-step-btn.active {
            background: var(--accent-color);
            color: #0f172a;
        }

        .vol-mute-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 6px;
            cursor: pointer;
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
        }

        .vol-mute-btn.muted {
            color: #f43f5e;
        }

        .vol-mute-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Player Flotante Inferior */
        .floating-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            padding: 10px 16px;
            box-sizing: border-box;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .floating-player.active {
            display: flex;
        }

        .floating-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .floating-logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
            background: #000;
            border-radius: 8px;
            padding: 3px;
        }

        .floating-text .title {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .floating-text .desc {
            font-size: 0.75rem;
            color: #34d399;
        }

        @media (max-width: 480px) {
            .controls-container {
                flex-direction: column;
            }
            .search-input, .refresh-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Radios Streaming - GUATEMALA</h1>
            <p class="subtitle">Selecciona tu estación favorita para iniciar la transmisión.</p>
        </header>

        <div class="controls-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora...">
            <button id="refreshBtn" class="refresh-btn" title="Reiniciar Página">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                Actualizar Página
            </button>
        </div>

        <div class="grid-stations" id="stationsGrid"></div>
    </div>

    <div class="floating-player" id="floatingPlayer">
        <div class="floating-info">
            <img id="floatingLogo" src="" alt="" class="floating-logo">
            <div class="floating-text">
                <div class="title" id="floatingTitle">Sin selección</div>
                <div class="desc" id="floatingStatus">En vivo</div>
            </div>
        </div>
        <button class="play-btn" id="floatingPlayBtn" title="Play/Pause">
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>

    <script>
        const stations = [
            { name: "Xtrema On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/8bp8yay2zaog/master.m3u8", logo: "xtrema.png" },
            { name: "La Marca On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/x9til9l95v7l/master.m3u8", logo: "lamarca.png" },
            { name: "Galaxia On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/3r10218cqvb6/master.m3u8", logo: "galaxia.png" },
            { name: "Tropicálida On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/5hic8sbcobol/master.m3u8", logo: "tropicalida.png" },
            { name: "Alfa On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/r0nwiyol2l12/master.m3u8", logo: "alfa.png" },
            { name: "Éxitos On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/yff15vi5xsxi/master.m3u8", logo: "exitos.png" },
            { name: "Fiesta FM On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/h8fdwk021ch2/master.m3u8", logo: "fiesta.png" },
            { name: "Joya On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/5zgdqpigoa9d/master.m3u8", logo: "joya.png" },
            { name: "Ranchera On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/051kh1xde9ws/master.m3u8", logo: "ranchera.png" },
            { name: "Sonora On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/6on6zmhisqhm/master.m3u8", logo: "sonora.png" },
            { name: "Éxitos XELA On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/vk54lkazkyxg/master.m3u8", logo: "exitosx.png" },
            { name: "Flix Xela On Line", url: "https://ddycmnicl95kp.cloudfront.net/live/bc0guefb9qsv/master.m3u8", logo: "flix.png" }
        ];

        const gridContainer = document.getElementById('stationsGrid');
        const activeAudios = [];
        const activeCards = [];
        const playBtns = [];
        const statusSpans = [];
        const hlsPlayers = [];
        const gainNodes = [];
        let audioCtx = null;
        let currentPlayingIndex = -1;

        const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        const pauseIcon = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        const iconVolHigh = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        const iconMute = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        const floatingPlayer = document.getElementById('floatingPlayer');
        const floatingPlayBtn = document.getElementById('floatingPlayBtn');
        const floatingTitle = document.getElementById('floatingTitle');
        const floatingStatus = document.getElementById('floatingStatus');
        const floatingLogo = document.getElementById('floatingLogo');

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        stations.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = 'station-card';
            card.innerHTML = `
                <div class="logo-container">
                    <img src="${station.logo}" alt="${station.name}" class="station-logo" onerror="this.src='https://via.placeholder.com/100x60?text=RADIO'">
                </div>
                <div class="station-info">
                    <div class="station-name">${station.name}</div>
                    <div class="status" id="status-${index}">Listo</div>
                </div>
                <audio id="audio-${index}" crossorigin="anonymous" preload="none"></audio>
                <div class="custom-player">
                    <button class="play-btn" id="btn-${index}" title="Reproducir">${playIcon}</button>
                    <div class="vol-btn-group">
                        <button class="vol-mute-btn" id="mute-${index}" title="Silenciar">${iconVolHigh}</button>
                    </div>
                </div>`;
            gridContainer.appendChild(card);

            const audio = card.querySelector('audio');
            const playBtn = card.querySelector('.play-btn');
            const status = card.querySelector('.status');
            const muteBtn = card.querySelector('.vol-mute-btn');
            const stepBtns = card.querySelectorAll('.vol-step-btn');

            activeAudios.push(audio);
            activeCards.push(card);
            playBtns.push(playBtn);
            statusSpans.push(status);

            // CONFIGURACIÓN HLS FIJA (Restaurada la estabilidad del código original sin aceleraciones)
            if (window.Hls && Hls.isSupported()) {
                const hls = new Hls({ 
                    liveSyncDurationCount: 3, 
                    maxLiveSyncPlaybackRate: 1.0 
                });
                hls.loadSource(station.url);
                hls.attachMedia(audio);
                hlsPlayers[index] = hls;
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = station.url;
            }

            playBtn.addEventListener('click', () => handlePlayTrigger(index));

            stepBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    initAudioContext();
                    setupWebAudioGain(index);
                    const volValue = parseFloat(btn.getAttribute('data-vol'));
                    
                    if (gainNodes[index]) {
                        gainNodes[index].gain.setValueAtTime(volValue, audioCtx.currentTime);
                    }
                    audio.volume = volValue;

                    stepBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    muteBtn.classList.remove('muted');
                    muteBtn.innerHTML = iconVolHigh;
                });
            });

            muteBtn.addEventListener('click', () => {
                initAudioContext();
                setupWebAudioGain(index);
                const isMuted = muteBtn.classList.toggle('muted');

                if (gainNodes[index]) {
                    gainNodes[index].gain.setValueAtTime(isMuted ? 0 : 1.0, audioCtx.currentTime);
                }
                audio.muted = isMuted;
                muteBtn.innerHTML = isMuted ? iconMute : iconVolHigh;
            });

            audio.addEventListener('playing', () => {
                currentPlayingIndex = index;
                syncUI();
                status.textContent = 'En vivo';
                floatingStatus.textContent = 'En vivo';
            });

            audio.addEventListener('pause', () => syncUI());
        });

        function setupWebAudioGain(index) {
            if (!gainNodes[index] && audioCtx) {
                try {
                    const source = audioCtx.createMediaElementSource(activeAudios[index]);
                    const gainNode = audioCtx.createGain();
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    gainNodes[index] = gainNode;
                } catch (e) {
                    console.debug('WebAudio binding:', e);
                }
            }
        }

        async function handlePlayTrigger(index) {
            initAudioContext();
            setupWebAudioGain(index);

            const targetAudio = activeAudios[index];
            if (currentPlayingIndex === index && !targetAudio.paused) {
                targetAudio.pause();
                return;
            }

            // Detener todas las demás emisoras
            activeAudios.forEach((aud, i) => { if (i !== index && !aud.paused) aud.pause(); });

            currentPlayingIndex = index;
            statusSpans[index].textContent = 'Conectando…';
            floatingStatus.textContent = 'Conectando…';

            if (hlsPlayers[index]) {
                hlsPlayers[index].stopLoad();
                hlsPlayers[index].startLoad();
            } else {
                targetAudio.src = stations[index].url + '?t=' + Date.now();
                targetAudio.load();
            }

            try {
                await targetAudio.play();
            } catch (err) {
                statusSpans[index].textContent = 'Error al conectar';
            }
        }

        function syncUI() {
            activeAudios.forEach((audio, idx) => {
                const isPlaying = !audio.paused && !audio.ended;
                activeCards[idx].classList.toggle('playing', isPlaying);
                playBtns[idx].innerHTML = isPlaying ? pauseIcon : playIcon;

                if (!isPlaying && statusSpans[idx].textContent === 'En vivo') {
                    statusSpans[idx].textContent = 'Pausado';
                }
            });

            if (currentPlayingIndex >= 0) {
                const isPlaying = !activeAudios[currentPlayingIndex].paused;
                floatingLogo.src = stations[currentPlayingIndex].logo;
                floatingTitle.textContent = stations[currentPlayingIndex].name;
                floatingStatus.textContent = isPlaying ? 'En vivo' : 'Pausado';
                floatingPlayBtn.innerHTML = isPlaying ? pauseIcon : playIcon;
                floatingPlayer.classList.add('active');
            }
        }

        floatingPlayBtn.addEventListener('click', () => {
            if (currentPlayingIndex >= 0) handlePlayTrigger(currentPlayingIndex);
        });

        // Buscador
        document.getElementById('searchInput').addEventListener('input', e => {
            const query = e.target.value.toLowerCase().trim();
            activeCards.forEach((card, idx) => {
                card.style.display = stations[idx].name.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        });

        // REINICIO COMPLETO DE PÁGINA
        document.getElementById('refreshBtn').addEventListener('click', () => {
            // Detener transmisiones activas antes de recargar
            activeAudios.forEach(aud => aud.pause());
            // Recargar la página totalmente limpia
            location.reload();
        });
    </script>
</body>
</html>
